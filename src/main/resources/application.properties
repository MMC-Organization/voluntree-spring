spring.application.name=voluntree
spring.profiles.active=dev

# Database connection settings
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hibernate & Flyway settings
spring.jpa.hibernate.ddl-auto=validate

# Session cookie setting
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true

# Ip config
server.forward-headers-strategy=framework

# Session redis settings
# Redis server host.
spring.data.redis.host=${REDIS_HOST}
# Login password of the redis server.
spring.data.redis.password=${REDIS_PASSWORD}
# Redis server port.
spring.data.redis.port=6379
# Session timeout. If a duration suffix is not specified, seconds is used.
server.servlet.session.timeout=8h
# Sessions flush mode.
spring.session.data.redis.flush-mode=on_save
# Namespace for keys used to store sessions.
spring.session.data.redis.namespace=spring:session

#---
spring.config.activate.on-profile=dev

spring.jpa.properties.hibernate.default_schema=develop
spring.flyway.default-schema=develop
server.servlet.session.cookie.secure=false

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.transaction=TRACE
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

